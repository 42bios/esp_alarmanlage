<svg xmlns="http://www.w3.org/2000/svg" width="80mm" height="80mm" viewBox="0 0 80 80">
  <!--
    Laser-Cut Deckel fuer JUNG LS 990, 1-fach Rahmen.
    Touch-Version: die Platte bleibt bis auf die 4 LED-Pinholes komplett
    geschlossen - die 12 Zahlen-/Symbolfelder werden nur GRAVIERT (Etch),
    dahinter liegen Kupferpads auf einer kleinen Traegerplatine, die vom
    MPR121-Touchsensor ausgelesen werden. Kein Durchbruch fuer Taster mehr.

    ACHTUNG: Masse sind Richtwerte (Rahmenausschnitt ~50x50mm, Schraubenabstand
    ~60mm) - unbedingt am echten Rahmen/CD-Blindabdeckung nachmessen bevor
    geschnitten wird! Alle Masse in mm, Ursprung oben links der 80x80mm Platte.
    Materialstaerke fuer kapazitives Touch durch Acryl/PMMA: ~2-3mm empfohlen
    (dicker = weniger empfindlich, MPR121-Schwellwert ggf. anpassen).

    Beleuchtung: KEINE einzelnen LED-Loecher mehr. Stattdessen 2x RGB-LED,
    die von der UNTEREN Kante der Platte seitlich ins Material einstrahlen
    (Kantenbeleuchtung / Edge-Lit). Laser-geschnittene Kanten sind glasklar
    poliert genug fuer Totalreflexion - das Licht laeuft im Material bis es
    an einer gravierten Flaeche (die Ziffern/Symbole) gestreut austritt.
    Nur die Gravuren gluehen, der Rest der Platte bleibt dunkel. Markierung
    der LED-Position siehe unten an der unteren Aussenkante (nicht in der
    Plattenflaeche selbst - die LEDs sitzen seitlich an der Kante, nicht
    dahinter).

    Layer:
      - Rote Linien (class=cut)   -> Laser: Schneiden (Aussenkontur)
      - Blaue Linien (class=etch) -> Laser: Gravur (Touch-Symbole/Zahlen + Zonenmarkierung, NICHT durchschneiden)
  -->
  <style>
    .cut   { fill:none; stroke:#ff0000; stroke-width:0.1; }
    .etch  { fill:none; stroke:#0000ff; stroke-width:0.1; }
    .label { font-family:Arial, sans-serif; font-size:3px; fill:#0000ff; stroke:none; text-anchor:middle; }
    .mount { fill:none; stroke:#ff0000; stroke-width:0.1; }
  </style>

  <!-- Aussenkontur der Platte: 80x80mm, deckt den LS990-Rahmen ab -->
  <rect class="cut" x="0" y="0" width="80" height="80" rx="2" ry="2"/>

  <!-- Montage-/Zentrierloecher passend zu LS990-Traeger (Richtwert 60mm Lochabstand) -->
  <circle class="mount" cx="10" cy="10" r="1.6"/>
  <circle class="mount" cx="70" cy="10" r="1.6"/>
  <circle class="mount" cx="10" cy="70" r="1.6"/>
  <circle class="mount" cx="70" cy="70" r="1.6"/>

  <!-- Sichtbarer Rahmenausschnitt (Referenzlinie, NICHT schneiden - nur Orientierung) -->
  <rect class="etch" x="15" y="15" width="50" height="50"/>
  <text class="label" x="40" y="13" text-anchor="middle">Rahmen-Referenz ~50x50mm (nicht schneiden)</text>

  <!--
    Markierung der 2 Kanten-LEDs an der unteren Aussenkante (y=80). Sitzen
    AUSSEN an der Schnittkante, nicht als Loch in der Flaeche - Pfeile zeigen
    nur die Einstrahlrichtung ins Material.
  -->
  <g>
    <line class="etch" x1="30" y1="80" x2="30" y2="75"/>
    <line class="etch" x1="50" y1="80" x2="50" y2="75"/>
    <text class="label" x="30" y="73.5" font-size="2.2">LED</text>
    <text class="label" x="50" y="73.5" font-size="2.2">LED</text>
  </g>

  <!--
    Touch-Zonen-Grid: 3 Spalten x 4 Zeilen, nur graviert (Zonenumriss + Symbol),
    kein Durchbruch. Pitch 11mm in beide Richtungen, symmetrisch zur Boxmitte
    (x=40), komplett innerhalb des 50x50-Referenzrahmens (y: 27-64.5, x:
    24.5-55.5 inkl. Radius - passt mit Rand). Jede Zone entspricht einem
    MPR121-Kanal / Kupferpad dahinter (Pad-Durchmesser ca. 8-9mm, etwas
    kleiner als die Gravurzone).
    Reihenfolge (wie im ESPHome-Panel): 1 2 3 / 4 5 6 / 7 8 9 / ARM 0 DISARM
  -->
  <!-- Spalten x=29,40,51 - Zeilen y=27,38,49,60 -->
  <g>
    <!-- Reihe 1: 1 2 3 -->
    <circle class="etch" cx="29" cy="27" r="4.5"/>
    <text class="label" x="29" y="28.2" font-size="2.8">1</text>
    <circle class="etch" cx="40" cy="27" r="4.5"/>
    <text class="label" x="40" y="28.2" font-size="2.8">2</text>
    <circle class="etch" cx="51" cy="27" r="4.5"/>
    <text class="label" x="51" y="28.2" font-size="2.8">3</text>

    <!-- Reihe 2: 4 5 6 -->
    <circle class="etch" cx="29" cy="38" r="4.5"/>
    <text class="label" x="29" y="39.2" font-size="2.8">4</text>
    <circle class="etch" cx="40" cy="38" r="4.5"/>
    <text class="label" x="40" y="39.2" font-size="2.8">5</text>
    <circle class="etch" cx="51" cy="38" r="4.5"/>
    <text class="label" x="51" y="39.2" font-size="2.8">6</text>

    <!-- Reihe 3: 7 8 9 -->
    <circle class="etch" cx="29" cy="49" r="4.5"/>
    <text class="label" x="29" y="50.2" font-size="2.8">7</text>
    <circle class="etch" cx="40" cy="49" r="4.5"/>
    <text class="label" x="40" y="50.2" font-size="2.8">8</text>
    <circle class="etch" cx="51" cy="49" r="4.5"/>
    <text class="label" x="51" y="50.2" font-size="2.8">9</text>

    <!-- Reihe 4: ARM 0 DISARM (ARM/DISARM als laengliche Zonen statt rund) -->
    <ellipse class="etch" cx="29" cy="60" rx="5.3" ry="4.5"/>
    <text class="label" x="29" y="61" font-size="2.2">ARM</text>
    <circle class="etch" cx="40" cy="60" r="4.5"/>
    <text class="label" x="40" y="61.2" font-size="2.8">0</text>
    <ellipse class="etch" cx="51" cy="60" rx="5.3" ry="4.5"/>
    <text class="label" x="51" y="61" font-size="2.2">DIS</text>
  </g>
</svg>
