substitutions:
  device_name: alarmanlage
  friendly_name: Alarmanlage Bedieneinheit
  # Wichtig: Pins passend zu deinem echten Verdrahtungsplan anpassen.
  # Bei Ethernet sind RMII-Pins reserviert und nicht frei nutzbar.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.6.0
  project:
    name: local.esp_alarmanlage
    version: "4.0.0"

esp32:
  board: esp32-poe-iso
  framework:
    type: arduino

logger:
  baud_rate: 0

# Alle Entities werden ueber die native API an Home Assistant gemeldet.
# Diese Bedieneinheit enthaelt KEINE Alarmlogik mehr (kein PIN-Check, kein
# Arm/Disarm-Status, keine Tuerkontakte, keine Sirene) - das laeuft komplett
# als HA-Automation/Package. Das Board meldet nur rohe Tastendruecke und
# nimmt LED-Befehle von HA entgegen.
api:

ota:
  - platform: esphome

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO17_OUT
  phy_addr: 0
  power_pin: GPIO12

web_server:
  port: 80

i2c:
  sda: GPIO32
  scl: GPIO33
  scan: true

# Kapazitiver 12-Kanal-Touchsensor statt mechanischer Taster. Jeder Kanal
# haengt an einem kleinen Kupferpad hinter der Frontplatte (Acryl/PMMA,
# ~2-3mm), die Symbole/Ziffern werden nur graviert, nicht durchgeschnitten -
# die Platte bleibt komplett geschlossen (kein Eindringen von Feuchtigkeit/
# Staub durch Tasterloecher).
mpr121:
  - id: touch_panel
    address: 0x5A

# 12 Touch-Kanaele (0-9, ARM, DISARM). Kein Matrix-Scan noetig - jeder Kanal
# ist eine eigene HA-Entity. Die PIN-Logik (Ziffern sammeln, mit Code
# vergleichen, Lockout) lebt komplett in HA.
binary_sensor:
  - platform: mpr121
    mpr121_id: touch_panel
    channel: 0
    name: "${friendly_name} Taste 1"

  - platform: mpr121
    mpr121_id: touch_panel
    channel: 1
    name: "${friendly_name} Taste 2"

  - platform: mpr121
    mpr121_id: touch_panel
    channel: 2
    name: "${friendly_name} Taste 3"

  - platform: mpr121
    mpr121_id: touch_panel
    channel: 3
    name: "${friendly_name} Taste 4"

  - platform: mpr121
    mpr121_id: touch_panel
    channel: 4
    name: "${friendly_name} Taste 5"

  - platform: mpr121
    mpr121_id: touch_panel
    channel: 5
    name: "${friendly_name} Taste 6"

  - platform: mpr121
    mpr121_id: touch_panel
    channel: 6
    name: "${friendly_name} Taste 7"

  - platform: mpr121
    mpr121_id: touch_panel
    channel: 7
    name: "${friendly_name} Taste 8"

  - platform: mpr121
    mpr121_id: touch_panel
    channel: 8
    name: "${friendly_name} Taste 9"

  - platform: mpr121
    mpr121_id: touch_panel
    channel: 9
    name: "${friendly_name} Taste 0"

  - platform: mpr121
    mpr121_id: touch_panel
    channel: 10
    name: "${friendly_name} Taste ARM"

  - platform: mpr121
    mpr121_id: touch_panel
    channel: 11
    name: "${friendly_name} Taste DISARM"

mcp23017:
  # Nur noch fuer die 4 LEDs - Taster laufen jetzt ueber den MPR121, daher
  # reichen 4 von 16 Pins.
  - id: mcp_panel
    address: 0x20

# 4 Status-LEDs, komplett von HA gesteuert (light.turn_on/off Service-Calls
# aus der HA-Automation heraus, z.B. bei alarm_control_panel-Zustandswechsel
# oder als kurzes "Taste erkannt"-Blinken auf der Aktiv-LED). Anders als die
# Touchflaechen brauchen die LEDs weiterhin ein kleines durchgehendes Loch
# bzw. ein mattiertes Fenster in der Frontplatte, damit sie sichtbar sind.
output:
  - platform: gpio
    pin: {mcp23xxx: mcp_panel, number: 0, mode: {output: true}}
    id: led_armed_out
  - platform: gpio
    pin: {mcp23xxx: mcp_panel, number: 1, mode: {output: true}}
    id: led_disarmed_out
  - platform: gpio
    pin: {mcp23xxx: mcp_panel, number: 2, mode: {output: true}}
    id: led_alarm_out
  - platform: gpio
    pin: {mcp23xxx: mcp_panel, number: 3, mode: {output: true}}
    id: led_active_out

light:
  - platform: binary
    id: led_armed
    name: "${friendly_name} LED Armed"
    output: led_armed_out
  - platform: binary
    id: led_disarmed
    name: "${friendly_name} LED Disarmed"
    output: led_disarmed_out
  - platform: binary
    id: led_alarm
    name: "${friendly_name} LED Alarm"
    output: led_alarm_out
  - platform: binary
    id: led_active
    name: "${friendly_name} LED Aktiv"
    output: led_active_out
