substitutions:
  device_name: alarmanlage
  friendly_name: Alarmanlage Bedieneinheit
  # Wichtig: Pins passend zu deinem echten Verdrahtungsplan anpassen.
  # Bei Ethernet sind RMII-Pins reserviert und nicht frei nutzbar.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.6.0
  project:
    name: local.esp_alarmanlage
    version: "3.0.0"

esp32:
  board: esp32-poe-iso
  framework:
    type: arduino

logger:
  baud_rate: 0

# Alle Entities werden ueber die native API an Home Assistant gemeldet.
# Diese Bedieneinheit enthaelt KEINE Alarmlogik mehr (kein PIN-Check, kein
# Arm/Disarm-Status, keine Tuerkontakte, keine Sirene) - das laeuft komplett
# als HA-Automation/Package. Das Board meldet nur rohe Tastendruecke und
# nimmt LED-Befehle von HA entgegen.
api:

ota:
  - platform: esphome

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO17_OUT
  phy_addr: 0
  power_pin: GPIO12

web_server:
  port: 80

i2c:
  sda: GPIO32
  scl: GPIO33
  scan: true

mcp23017:
  # Ein einzelner MCP23017 reicht: 12 Taster (Eingaenge) + 4 LEDs (Ausgaenge)
  # = 16 Pins, passt exakt. Kein zweiter Expander noetig, da Tueren/Sirene
  # jetzt ueber andere HA-Geraete/Integrationen laufen.
  - id: mcp_panel
    address: 0x20

# 12 einzelne Taster (0-9, ARM, DISARM), jeder gegen GND, interner Pullup.
# Kein Matrix-Scan - jeder Taster ist eine eigene HA-Entity. Die PIN-Logik
# (Ziffern sammeln, mit Code vergleichen, Lockout) lebt komplett in HA.
binary_sensor:
  - platform: gpio
    name: "${friendly_name} Taste 1"
    pin: {mcp23xxx: mcp_panel, number: 0, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 20ms}]

  - platform: gpio
    name: "${friendly_name} Taste 2"
    pin: {mcp23xxx: mcp_panel, number: 1, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 20ms}]

  - platform: gpio
    name: "${friendly_name} Taste 3"
    pin: {mcp23xxx: mcp_panel, number: 2, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 20ms}]

  - platform: gpio
    name: "${friendly_name} Taste 4"
    pin: {mcp23xxx: mcp_panel, number: 3, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 20ms}]

  - platform: gpio
    name: "${friendly_name} Taste 5"
    pin: {mcp23xxx: mcp_panel, number: 4, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 20ms}]

  - platform: gpio
    name: "${friendly_name} Taste 6"
    pin: {mcp23xxx: mcp_panel, number: 5, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 20ms}]

  - platform: gpio
    name: "${friendly_name} Taste 7"
    pin: {mcp23xxx: mcp_panel, number: 6, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 20ms}]

  - platform: gpio
    name: "${friendly_name} Taste 8"
    pin: {mcp23xxx: mcp_panel, number: 7, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 20ms}]

  - platform: gpio
    name: "${friendly_name} Taste 9"
    pin: {mcp23xxx: mcp_panel, number: 8, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 20ms}]

  - platform: gpio
    name: "${friendly_name} Taste 0"
    pin: {mcp23xxx: mcp_panel, number: 9, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 20ms}]

  - platform: gpio
    name: "${friendly_name} Taste ARM"
    pin: {mcp23xxx: mcp_panel, number: 10, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 20ms}]

  - platform: gpio
    name: "${friendly_name} Taste DISARM"
    pin: {mcp23xxx: mcp_panel, number: 11, mode: {input: true, pullup: true}, inverted: true}
    filters: [{delayed_on: 20ms}]

# 4 Status-LEDs, komplett von HA gesteuert (light.turn_on/off Service-Calls
# aus der HA-Automation heraus, z.B. bei alarm_control_panel-Zustandswechsel
# oder als kurzes "Taste erkannt"-Blinken auf der Aktiv-LED).
output:
  - platform: gpio
    pin: {mcp23xxx: mcp_panel, number: 12, mode: {output: true}}
    id: led_armed_out
  - platform: gpio
    pin: {mcp23xxx: mcp_panel, number: 13, mode: {output: true}}
    id: led_disarmed_out
  - platform: gpio
    pin: {mcp23xxx: mcp_panel, number: 14, mode: {output: true}}
    id: led_alarm_out
  - platform: gpio
    pin: {mcp23xxx: mcp_panel, number: 15, mode: {output: true}}
    id: led_active_out

light:
  - platform: binary
    id: led_armed
    name: "${friendly_name} LED Armed"
    output: led_armed_out
  - platform: binary
    id: led_disarmed
    name: "${friendly_name} LED Disarmed"
    output: led_disarmed_out
  - platform: binary
    id: led_alarm
    name: "${friendly_name} LED Alarm"
    output: led_alarm_out
  - platform: binary
    id: led_active
    name: "${friendly_name} LED Aktiv"
    output: led_active_out
